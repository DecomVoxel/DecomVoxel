auto_exposure:
  auto_exposure_upd_ckpt:
  - 5000
  - 10000
  - 15000
  enable: false
bounding:
  bound_mode: default
  bound_scale: 1.0
  forward_dist_scale: 1.0
  pcd_density_rate: 0.1
data:
  blend_mask: true
  data_device: cpu
  depth_paths: ''
  depth_scale: 1.0
  eval: true
  extension: .png
  images: images
  n_sparse: -1
  ncc_scale: 1.0
  res_downscale: 0.0
  res_width: 0
  source_path: outputs/replica_recon_large/scan1_tsdf_test_bg_inpaint/see3d_guidance_views/da2_mono_cache
  test_every: 8
init:
  aabb_crop: false
  geo_init: -10.0
  init_n_level: 6
  init_out_ratio: 2.0
  outside_mode: heuristic
  sh0_init: 0.5
  sh_degree_init: 3
  shs_init: 0.0
model:
  black_background: false
  density_mode: exp_linear_11
  model_path: outputs/replica_recon_large/scan1
  outside_level: 5
  sh_degree: 3
  ss: 1.5
  vox_geo_mode: triinterp1
  white_background: false
optimizer:
  geo_lr: 0.025
  lr_decay_ckpt:
  - 19000
  lr_decay_mult: 0.1
  n_warmup: 100
  optim_beta1: 0.1
  optim_beta2: 0.99
  optim_eps: 1.0e-15
  sh0_lr: 0.01
  shs_lr: 0.00025
procedure:
  n_iter: 20000
  prune_every: 1000
  prune_from: 1000
  prune_thres_final: 0.05
  prune_thres_init: 0.0001
  prune_until: 18000
  reset_density:
  - -1
  reset_sh_ckpt:
  - -1
  sche_mult: 1.0
  seed: 3721
  subdivide_all_until: 0
  subdivide_every: 1000
  subdivide_from: 1000
  subdivide_max_num: 10000000
  subdivide_samp_thres: 1.0
  subdivide_save_gpu: false
  subdivide_target_scale: 90.0
  subdivide_until: 15000
regularizer:
  W_enlarge_from: 3000
  depth_smooth_from: 1000000000
  lambda_abs_depth: 0.02
  depthanythingv2_alpha_adjust: false
  depthanythingv2_end: 20000
  depthanythingv2_end_mult: 0.05
  depthanythingv2_from: 1000
  depthanythingv2_overall: false
  dist_from: 10000
  enable_da2_uncertainty: true
  huber_thres: 0.03
  lambda_R_concen: 0.01
  lambda_T_concen: 0.0
  lambda_T_inside: 0.01
  lambda_depthanythingv2: 0.05
  lambda_dist: 0.
  lambda_normal_dmean: 0.001
  lambda_normal_dmed: 0.001
  lambda_normal_dmono: 0.001
  lambda_photo: 0.2
  lambda_rectify: 1.0e-05
  lambda_scaling_penalty: 1.0e-06
  lambda_ssim: 0.02
  lambda_tv_density: 1.0e-10
  level_uncertainty_from: 0
  multi_view_anneal_scale: 1.0
  multi_view_geo_weight: 0.003
  multi_view_interval: 3
  multi_view_ncc_weight: 0.015
  multi_view_patch_size: 2
  multi_view_pixel_noise_th: 1.0
  multi_view_sample_num: 10240000
  multi_view_weight_from_iter: 10000
  n_dmean_end: 20000
  n_dmean_from: 10000
  n_dmean_ks: 3
  n_dmean_tol_deg: 90.0
  n_dmed_end: 20000
  n_dmed_from: 3000
  n_dmono_end: 20000
  n_dmono_from: 3000
  power_level_uncertainty: 1.0
  rand_bg: false
  rectifiy_from: 5000
  scaling_penalty_end: 20000
  scaling_penalty_from: 1000
  ss_aug_max: 1.5
  tv_decay_every: 1000
  tv_decay_mult: 1.0
  tv_from: 0
  tv_sparse: false
  tv_until: 10000
  use_huber: false
  use_l1: true
  voxel_dropout_min: 1.0
